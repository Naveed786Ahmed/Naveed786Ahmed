<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0e19"/><stop offset="1" stop-color="#15132a"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#d2a6ff"/></linearGradient></defs><rect x="5" y="5" width="540" height="155" rx="14" fill="#141b29" stroke="#354054" stroke-width="1.4"/><rect x="23" y="25" width="44" height="38" rx="9" fill="#2a2044"/><text x="34" y="51" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#b47aff">01</text><text x="81" y="53" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#f5f6fb">RETRIEVAL &amp; GROUNDING</text><text x="81" y="91" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#aab5c8">PDF ingestion, semantic retrieval,</text><text x="81" y="118" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#aab5c8">page-level citations and evaluation.</text><rect x="555" y="5" width="540" height="155" rx="14" fill="#141b29" stroke="#354054" stroke-width="1.4"/><rect x="573" y="25" width="44" height="38" rx="9" fill="#2a2044"/><text x="584" y="51" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#b47aff">02</text><text x="631" y="53" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#f5f6fb">LLM APPLICATIONS</text><text x="631" y="91" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#aab5c8">Structured model outputs, API-backed</text><text x="631" y="118" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#aab5c8">services and controlled fallbacks.</text><rect x="5" y="170" width="540" height="155" rx="14" fill="#141b29" stroke="#354054" stroke-width="1.4"/><rect x="23" y="190" width="44" height="38" rx="9" fill="#2a2044"/><text x="34" y="216" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#b47aff">03</text><text x="81" y="218" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#f5f6fb">WORKFLOW ORCHESTRATION</text><text x="81" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#aab5c8">Webhook events, persisted state,</text><text x="81" y="283" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#aab5c8">retries and human approvals.</text><rect x="555" y="170" width="540" height="155" rx="14" fill="#141b29" stroke="#354054" stroke-width="1.4"/><rect x="573" y="190" width="44" height="38" rx="9" fill="#2a2044"/><text x="584" y="216" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#b47aff">04</text><text x="631" y="218" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#f5f6fb">AGENTIC SYSTEM DESIGN</text><text x="631" y="256" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#aab5c8">Tool-integrated workflows, context</text><text x="631" y="283" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#aab5c8">management and bounded decisions.</text></svg>