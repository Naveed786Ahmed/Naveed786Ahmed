ool-integrated workflows, contextual</text><text x="38" y="310" fill="#b5bfd0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">decisions and controlled tool use.</text><rect x="558" y="178" width="530" height="150" rx="12" fill="#151b25" stroke="#303747"/><rect x="577" y="202" width="4" height="33" rx="2" fill="#b17bff"/><text x="593" y="217" fill="#b17bff" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">04 / BACKEND</text><text x="582" y="259" fill="#f0f3fa" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Integration Engineering</text><text x="582" y="289" fill="#b5bfd0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Python services, REST APIs, data</text><text x="582" y="310" fill="#b5bfd0" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">contracts and containerized delivery.</text>
